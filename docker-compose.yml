services:
  ascend:
    build: .
    container_name: ascend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    user: "1000:1000"
    ports:
      - "127.0.0.1:7420:3001"
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
